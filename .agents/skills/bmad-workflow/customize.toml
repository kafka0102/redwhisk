# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-workflow. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# Steps to run before the standard activation. Overrides append.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins. Overrides append.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run.
# Entries are literal facts or file references prefixed with `file:`.

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Handoff state path used for same-session soft cleanup. Override wins.

handoff_output_path = "{implementation_artifacts}/bmad-workflow-handoff.yaml"

# Allow this workflow to append a minimal epic/story seed when no matching
# backlog story exists for the user's input.

auto_create_planning_seed = true

# Create a minimal sprint-status.yaml when missing. Disable if the team requires
# sprint-planning to initialize tracking.

create_sprint_status_when_missing = true

# Stop after story creation so a human can approve the generated implementation spec.

require_story_approval = false

# Automatically run dev-story again after code-review leaves Review Follow-ups.

auto_continue_review_fix_loop = true

# Maximum review attempts when auto_continue_review_fix_loop is enabled.

max_review_cycles = 2

# Review policy passed to bmad-code-review. automatic minimizes prompts when
# bmad-code-review supports same-session defaults; otherwise child HALT applies.

review_policy = "automatic"

# Create a git commit for the completed story after validation.

auto_commit = true

# Command or note executed after final handoff is written. Leave empty for none.

on_complete = ""
