name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - devlop

# 触发发布需要写权限创建 Release 与上传资源
permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # PR 上的轻量构建验证：不产出 dmg，只确保前后端可编译
  check:
    name: 构建检查（PR）
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: 前端构建
        run: pnpm build

      - name: Cargo check
        run: cargo check --all-targets
        working-directory: src-tauri

  # tag 触发：构建 Universal Mac 包并创建 draft Release
  release-macos:
    name: 发布 Mac Universal 包
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 工具链 + Universal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Universal Mac 包（.app + .dmg）
        run: pnpm build:macos

      - name: 打包 .app 为 Release 资源
        shell: bash
        run: |
          set -euo pipefail

          app_path=""
          shopt -s nullglob
          for candidate in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            if [[ -d "${candidate}" ]]; then
              app_path="${candidate}"
              break
            fi
          done
          shopt -u nullglob

          if [[ -z "${app_path}" ]]; then
            echo "未找到 .app 产物" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          app_zip="src-tauri/target/universal-apple-darwin/release/bundle/macos/RedWhisk_${version}_universal.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" "${app_zip}"
          ls -lh "${app_zip}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: redwhisk-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip

      - name: 创建 Draft Release 并附带 .dmg 与 .app.zip
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
