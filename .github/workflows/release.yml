name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - devlop

# 触发发布需要写权限创建 Release 与上传资源
permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # PR 上的轻量构建验证：不产出可执行包，只确保前后端可编译
  check:
    name: 构建检查（PR）
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 两个文件大小门禁按 `--from <PR 基线>` 的 diff 口径复查，基线提交需在本地。
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # AGENTS.md 质量门禁要求前端行为改动必须跑全量 vitest；
      # 只跑全量（不跑 -t 过滤），因为部分既有用例在过滤运行下依赖同文件其它用例的时序。
      - name: 前端测试
        run: pnpm test

      - name: 前端构建
        run: pnpm build

      - name: Cargo check
        run: cargo check --all-targets
        working-directory: src-tauri

      # AGENTS.md §5 第 7 条：上面的 --all-targets 以 cfg(test) 编译，不能替代正式构建口径。
      # 依赖已被上一步拉齐，脚本内的 --offline 可命中缓存。
      - name: Rust 正式构建检查
        run: bash scripts/check-rust-compile.sh

      - name: Rust 测试
        run: cargo test --lib
        working-directory: src-tauri

      # 两个门禁默认只查未提交改动，提交后再跑等于空转；CI 里改用 PR 全量 diff 口径。
      - name: Rust 文件大小门禁
        run: bash scripts/check-rust-file-size.sh --from "${{ github.event.pull_request.base.sha }}"

      - name: 前端文件大小门禁
        run: bash scripts/check-frontend-file-size.sh --from "${{ github.event.pull_request.base.sha }}"

  # tag 触发：构建 Universal Mac 包并创建 draft Release
  release-macos:
    name: 发布 Mac Universal 包
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链 + Universal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Universal Mac 包（.app + DMG）
        run: pnpm build:macos

      - name: 打包 .app 为 Release 资源
        shell: bash
        run: |
          set -euo pipefail

          app_path=""
          shopt -s nullglob
          for candidate in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            if [[ -d "${candidate}" ]]; then
              app_path="${candidate}"
              break
            fi
          done
          shopt -u nullglob

          if [[ -z "${app_path}" ]]; then
            echo "未找到 .app 产物" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          app_zip="src-tauri/target/universal-apple-darwin/release/bundle/macos/RedWhisk_${version}_universal.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" "${app_zip}"
          ls -lh "${app_zip}"

      - name: 校验 DMG 产物
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          shopt -u nullglob
          if (( ${#dmg_files[@]} == 0 )); then
            echo "未找到 .dmg 产物" >&2
            exit 1
          fi
          ls -lh "${dmg_files[@]}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: redwhisk-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: 创建 Draft Release 并附带 DMG 与 .app.zip
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
