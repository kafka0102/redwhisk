<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · 远程 Issue 与 PR/MR 工作台</title>
<style>
  :root {
    --color-app: #ffffff;
    --color-surface: #ffffff;
    --color-surface-muted: #f1f2f4;
    --color-surface-subtle: #f7f7f8;
    --color-border: #e3e5e8;
    --color-border-strong: #d1d5db;
    --color-text: #17181a;
    --color-text-muted: #5f6368;
    --color-text-subtle: #8a8f98;
    --color-accent: #111111;
    --color-accent-muted: #e9eaee;
    --color-danger: #b42318;
    --color-danger-soft: #fef3f2;
    --color-success: #16794b;
    --color-success-soft: #eaf6ef;
    --color-warning: #8a5a00;
    --color-warning-soft: #fff8e6;
    --color-info: #1f5fa8;
    --color-info-soft: #eef4fb;
    --radius-control: 3px;
    --radius-card: 5px;
    --radius-dialog: 7px;
    --shadow-focus: 0 0 0 2px rgb(17 24 39 / 12%);
    --shadow-dialog: 0 12px 32px rgb(17 24 39 / 16%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--color-text);
    background: var(--color-app);
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: 0;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: 0; }
  button { cursor: pointer; }
  code, .mono {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  a { color: inherit; }
  .proto {
    display: grid;
    grid-template-columns: 256px minmax(0, 1fr);
    height: 100%;
    min-height: 0;
  }
  .proto-nav {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    background: var(--color-surface-subtle);
    border-right: 1px solid var(--color-border);
  }
  .proto-nav header { padding: 14px 14px 8px; }
  .proto-nav h1 { margin: 0; font-size: 13px; font-weight: 650; }
  .proto-kicker {
    margin: 4px 0 0;
    color: var(--color-text-subtle);
    font-size: 11px;
    line-height: 1.35;
  }
  .scene-list { flex: 1; min-height: 0; padding: 4px 0 8px; overflow: auto; }
  .scene-group {
    margin: 10px 14px 4px;
    color: var(--color-text-subtle);
    font-size: 11px;
  }
  .scene-list button {
    display: block;
    width: 100%;
    padding: 7px 14px;
    border: 0;
    background: transparent;
    text-align: left;
    color: var(--color-text-muted);
  }
  .scene-list button strong { margin-right: 6px; color: var(--color-text-subtle); font-weight: 600; }
  .scene-list button[aria-current="true"] {
    background: var(--color-accent-muted);
    color: var(--color-text);
    font-weight: 600;
  }
  .scene-list button[aria-current="true"] strong { color: var(--color-text); }
  .gaps {
    margin-top: auto;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--color-border);
    color: var(--color-text-muted);
    font-size: 11px;
    line-height: 1.45;
  }
  .gaps h2 { margin: 0 0 6px; color: var(--color-text); font-size: 11px; font-weight: 650; }
  .gaps ol { margin: 0; padding-left: 16px; }
  .gaps li + li { margin-top: 4px; }
  .proto-main {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    min-width: 0;
    min-height: 0;
  }
  .caption {
    margin: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--color-border);
    background: #fafafa;
  }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .state {
    margin: 0;
    max-height: 104px;
    overflow: auto;
    padding: 10px 16px;
    border-top: 1px solid var(--color-border);
    background: #fafafa;
    color: var(--color-text-muted);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  .app {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    height: 100%;
    min-height: 0;
  }
  .activity-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 0;
    border-right: 1px solid var(--color-border);
    background: var(--color-surface-subtle);
  }
  .activity-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-muted);
  }
  .activity-btn:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .activity-btn[aria-pressed="true"] {
    background: var(--color-accent-muted);
    color: var(--color-text);
  }
  .activity-bar .grow { flex: 1; }
  .workbench {
    display: grid;
    grid-template-rows: 40px minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
  }
  .workbench-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-size: 12px;
  }
  .workbench-header strong { color: var(--color-text); font-weight: 650; }
  .workbench-header .sep { color: var(--color-text-subtle); }
  .surface {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    background: var(--color-app);
  }
  .surface > .page,
  .surface > .settings-layout,
  .surface > .pr-list {
    grid-row: 3;
  }
  .surface-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 48px;
    padding: 0 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .surface-tabs { display: inline-flex; align-items: stretch; gap: 2px; height: 100%; }
  .surface-tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;
    border: 0;
    background: transparent;
    color: var(--color-text-muted);
    font-weight: 600;
  }
  .surface-tab[aria-selected="true"] { color: var(--color-text); }
  .surface-tab[aria-selected="true"]::after {
    position: absolute;
    right: 8px;
    bottom: -1px;
    left: 8px;
    height: 2px;
    background: var(--color-accent);
    content: "";
  }
  .surface-tab .count {
    padding: 0 5px;
    border-radius: 999px;
    background: var(--color-surface-muted);
    color: var(--color-text-muted);
    font-size: 11px;
    font-weight: 600;
  }
  .surface-actions { display: inline-flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn:hover { background: var(--color-surface-muted); }
  .btn:focus-visible { outline: 0; box-shadow: var(--shadow-focus); }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .btn-primary { border-color: var(--color-accent); background: var(--color-accent); color: #fff; }
  .btn-primary:hover { background: #2a2a2a; }
  .btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--color-text-muted); }
  .btn-ghost:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .btn-sm { height: 24px; padding: 0 8px; font-size: 11px; }
  .icon-btn {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-muted);
  }
  .icon-btn:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .select, .input, .textarea {
    width: 100%;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    color: var(--color-text);
  }
  .select, .input { height: 28px; padding: 0 8px; }
  .select { padding-right: 24px; }
  .textarea { padding: 7px 8px; resize: vertical; }
  .select:focus, .input:focus, .textarea:focus { outline: 0; box-shadow: var(--shadow-focus); }
  .select-inline { width: auto; height: 26px; font-size: 12px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 20px;
    padding: 0 6px;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .chip strong { color: var(--color-text); font-weight: 650; }
  .chip-success { border-color: #bfe3cf; background: var(--color-success-soft); color: var(--color-success); }
  .chip-danger { border-color: #f4c7c3; background: var(--color-danger-soft); color: var(--color-danger); }
  .chip-warning { border-color: #f0dfb0; background: var(--color-warning-soft); color: var(--color-warning); }
  .chip-info { border-color: #c9dcf3; background: var(--color-info-soft); color: var(--color-info); }
  .chip-merged { border-color: #e2d4f5; background: #f3ecfc; color: #6b3fa0; }
  .source-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-muted);
    font-size: 11px;
    font-weight: 600;
  }
  .source-badge svg { flex: 0 0 auto; }
  .muted { color: var(--color-text-muted); }
  .subtle { color: var(--color-text-subtle); }
  .danger { color: var(--color-danger); }
  .success { color: var(--color-success); }
  .warning { color: var(--color-warning); }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  .linkish { border: 0; background: transparent; color: var(--color-info); text-decoration: underline; cursor: pointer; }
  .linkish:hover { color: var(--color-text); }
  .sync-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-info-soft);
    color: var(--color-info);
    font-size: 12px;
  }
  .sync-banner.is-warning { background: var(--color-warning-soft); color: var(--color-warning); }
  .sync-banner.is-danger { background: var(--color-danger-soft); color: var(--color-danger); }
  .sync-banner .spacer { flex: 1; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    min-height: 0;
    padding: 12px;
    overflow: hidden;
  }
  .lane {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    padding: 8px;
    border-radius: var(--radius-card);
    background: var(--color-surface-subtle);
  }
  .lane-header {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 2px 2px 8px;
  }
  .lane-dot { width: 9px; height: 9px; border: 1.5px solid var(--color-text-subtle); border-radius: 50%; }
  .lane--running .lane-dot { border-color: #c89000; }
  .lane--review .lane-dot { border-color: #249447; }
  .lane--completed .lane-dot { border-color: #1681d9; background: #1681d9; }
  .lane-header h3 { margin: 0; font-size: 13px; font-weight: 650; }
  .lane-count { color: var(--color-text-subtle); font-size: 11px; }
  .lane-header .spacer { flex: 1; }
  .lane-cards { display: grid; align-content: start; gap: 8px; min-height: 0; overflow: auto; padding: 1px; }
  .card {
    display: grid;
    gap: 5px;
    padding: 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    background: var(--color-surface);
    text-align: left;
  }
  .card:hover { border-color: var(--color-border-strong); background: #fcfcfd; }
  .card.is-selected { border-color: var(--color-border-strong); box-shadow: var(--shadow-focus); }
  .card-meta { display: flex; align-items: center; gap: 7px; color: var(--color-text-subtle); font-size: 11px; white-space: nowrap; }
  .card-meta .spacer { flex: 1; }
  .card-id { flex: 0 0 auto; color: var(--color-text-muted); font-weight: 600; }
  .card-time { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card-title { color: var(--color-text); font-size: 13px; font-weight: 650; line-height: 1.35; }
  .card-desc { display: -webkit-box; overflow: hidden; color: var(--color-text-muted); font-size: 12px; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .card-labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .label-chip {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--color-surface-muted);
    color: var(--color-text-muted);
    font-size: 10px;
    font-weight: 600;
  }
  .card-pr {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    color: var(--color-text-muted);
    font-size: 11px;
  }
  .card-pr.is-blocked { color: var(--color-danger); }
  .card-pr.is-ok { color: var(--color-success); }

  .page {
    min-height: 0;
    overflow: auto;
    padding: 16px 20px 28px;
  }
  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--color-border);
  }
  .page-header h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 1.3; }
  .page-header .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 6px; color: var(--color-text-muted); font-size: 12px; }
  .page-actions { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 20px; margin-top: 14px; }
  .detail-main { min-width: 0; }
  .detail-side { display: grid; align-content: start; gap: 10px; min-width: 0; }
  .panel { border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid var(--color-border); }
  .panel-header h3 { margin: 0; font-size: 12px; font-weight: 650; }
  .panel-body { padding: 10px 11px; }
  .panel-body + .panel-body { border-top: 1px solid var(--color-border); }
  .facts { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; margin: 0; }
  .facts dt { color: var(--color-text-subtle); font-size: 11px; }
  .facts dd { min-width: 0; margin: 0; color: var(--color-text); font-size: 12px; overflow-wrap: anywhere; }
  .source-banner {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    background: var(--color-surface-subtle);
    color: var(--color-text-muted);
    font-size: 12px;
  }
  .source-banner .spacer { flex: 1; }
  .markdown { color: var(--color-text); font-size: 13px; line-height: 1.6; }
  .markdown h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 650; }
  .markdown h4 { margin: 12px 0 4px; font-size: 13px; font-weight: 650; }
  .markdown p { margin: 7px 0; }
  .markdown ul, .markdown ol { margin: 7px 0; padding-left: 20px; }
  .markdown li + li { margin-top: 3px; }
  .markdown pre { margin: 9px 0; padding: 9px 10px; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface-subtle); font-size: 12px; }
  .markdown code { padding: 1px 4px; border-radius: 3px; background: var(--color-surface-muted); font-size: 12px; }
  .markdown pre code { padding: 0; background: transparent; }
  .markdown blockquote { margin: 9px 0; padding: 2px 10px; border-left: 3px solid var(--color-border-strong); color: var(--color-text-muted); }
  .markdown table { width: 100%; border-collapse: collapse; margin: 9px 0; font-size: 12px; }
  .markdown th, .markdown td { padding: 5px 7px; border: 1px solid var(--color-border); text-align: left; }
  .markdown th { background: var(--color-surface-subtle); font-weight: 650; }
  .timeline { display: grid; gap: 0; margin: 14px 0 0; padding: 0; list-style: none; }
  .timeline-item { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 9px; padding: 0 0 14px; }
  .timeline-item::before { position: absolute; top: 24px; bottom: 0; left: 12px; width: 1px; background: var(--color-border); content: ""; }
  .timeline-item:last-child::before { display: none; }
  .avatar { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent-muted); color: var(--color-text-muted); font-size: 10px; font-weight: 700; }
  .avatar.is-agent { background: #e8f1ff; color: #1f5fa8; }
  .avatar.is-remote { background: #eef4fb; color: #1f5fa8; }
  .timeline-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 24px; color: var(--color-text-subtle); font-size: 11px; }
  .timeline-meta strong { color: var(--color-text); font-weight: 650; }
  .timeline-body { min-width: 0; }
  .comment { padding: 9px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); }
  .system-line { padding: 2px 0; color: var(--color-text-muted); font-size: 12px; }
  .linked-card { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); }
  .linked-card .grow { flex: 1; min-width: 0; }
  .linked-card .title { overflow: hidden; color: var(--color-text); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .linked-card .meta { color: var(--color-text-subtle); font-size: 11px; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--color-border); font-size: 12px; }
  .check-row:last-child { border-bottom: 0; }
  .check-row .grow { flex: 1; min-width: 0; }
  .check-icon { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700; }
  .check-icon.ok { background: var(--color-success-soft); color: var(--color-success); }
  .check-icon.bad { background: var(--color-danger-soft); color: var(--color-danger); }
  .check-icon.run { background: var(--color-warning-soft); color: var(--color-warning); }
  .check-icon.skip { background: var(--color-surface-muted); color: var(--color-text-subtle); }
  .empty-state { display: grid; place-items: center; gap: 8px; padding: 48px 20px; color: var(--color-text-muted); text-align: center; }
  .empty-state h3 { margin: 0; color: var(--color-text); font-size: 14px; font-weight: 650; }

  .pr-list { min-height: 0; overflow: auto; }
  .pr-filters { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
  .pr-filter {
    height: 26px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-muted);
    font-size: 12px;
    font-weight: 600;
  }
  .pr-filter[aria-pressed="true"] { border-color: var(--color-border); background: var(--color-surface-muted); color: var(--color-text); }
  .pr-filter .count { margin-left: 5px; color: var(--color-text-subtle); font-size: 11px; }
  .pr-head, .pr-row {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) 170px 118px 92px;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--color-border);
  }
  .pr-head { color: var(--color-text-subtle); font-size: 11px; font-weight: 600; background: var(--color-surface-subtle); }
  .pr-row { background: var(--color-surface); }
  .pr-row:hover { background: #fcfcfd; }
  .pr-main { min-width: 0; }
  .pr-title { overflow: hidden; color: var(--color-text); font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .pr-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 2px; color: var(--color-text-subtle); font-size: 11px; }
  .pr-state { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; }
  .pr-state.open { background: var(--color-success-soft); color: var(--color-success); }
  .pr-state.draft { background: var(--color-surface-muted); color: var(--color-text-subtle); }
  .pr-state.merged { background: #f0e9fb; color: #6b3fa0; }
  .pr-state.closed { background: var(--color-danger-soft); color: var(--color-danger); }
  .pr-cell { color: var(--color-text-muted); font-size: 12px; }
  .pr-cell .line { display: flex; align-items: center; gap: 4px; }
  .pr-cell .line + .line { margin-top: 2px; }

let sceneId = "s1";
let model = null;
let actionNote = "";

function esc(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function sceneById(id) {
  return SCENES.find((scene) => scene.id === id) ?? SCENES[0];
}

function applyScene(id) {
  const scene = sceneById(id);
  sceneId = scene.id;
  model = structuredClone(scene.model);
  actionNote = "";
  if (location.hash !== "#" + scene.id) {
    history.replaceState(null, "", "#" + scene.id);
  }
  render();
}

function renderNav() {
  const groups = [];
  for (const scene of SCENES) {
    const last = groups[groups.length - 1];
    if (!last || last.name !== scene.group) groups.push({ name: scene.group, items: [scene] });
    else last.items.push(scene);
  }
  document.getElementById("scene-list").innerHTML = groups.map((group) => {
    const buttons = group.items.map((scene) => {
      const index = SCENES.indexOf(scene) + 1;
      const current = scene.id === sceneId ? "true" : "false";
      return '<button type="button" data-scene="' + scene.id + '" aria-current="' + current + '"><strong>' + index + '</strong>' + esc(scene.title) + '</button>';
    }).join("");
    return '<div class="scene-group">' + esc(group.name) + '</div>' + buttons;
  }).join("");
}

  if (name === "terminal") return '<svg ' + common + '><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m8 10 3 2-3 2M13 14h4"/></svg>';
  if (name === "settings") return '<svg ' + common + '><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  if (name === "github") return '<svg ' + common + '><path d="M9 19c-4 1.5-4-2-6-2M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.3 1.2a11.4 11.4 0 0 0-6 0C7.1 2.8 6.1 3.1 6.1 3.1a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.7 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>';
  if (name === "gitlab") return '<svg ' + common + '><path d="m12 21 9-6-3.5-9L15 12H9L6.5 6 3 15l9 6Z"/></svg>';
  if (name === "check") return '<svg ' + common + '><path d="m5 12 4 4L19 6"/></svg>';
  if (name === "x") return '<svg ' + common + '><path d="M6 6l12 12M18 6 6 18"/></svg>';
  if (name === "refresh") return '<svg ' + common + '><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>';
  if (name === "external") return '<svg ' + common + '><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>';
  if (name === "play") return '<svg ' + common + '><path d="m8 5 11 7-11 7V5Z"/></svg>';
  if (name === "plus") return '<svg ' + common + '><path d="M12 5v14M5 12h14"/></svg>';
  if (name === "lock") return '<svg ' + common + '><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  if (name === "alert") return '<svg ' + common + '><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/></svg>';
  if (name === "back") return '<svg ' + common + '><path d="m15 18-6-6 6-6"/></svg>';
  return '<svg ' + common + '><circle cx="12" cy="12" r="8"/></svg>';
}

function activityBar(active) {
  const items = [
    ["issues", "Issues"],
    ["agents", "智能体"],
    ["code", "代码"],
    ["changes", "变更"],
    ["terminal", "终端"],
  ];
  const top = items.map(([key, label]) => {
    return '<button class="activity-btn" type="button" aria-label="' + label + '" aria-pressed="' + (active === key) + '">' + icon(key) + '</button>';
  }).join("");
  return '<nav class="activity-bar" aria-label="活动栏">' + top
    + '<div class="grow"></div>'
    + '<button class="activity-btn" type="button" aria-label="项目设置" aria-pressed="' + (active === "settings") + '">' + icon("settings") + '</button></nav>';
}

function workbenchHeader() {
  return '<header class="workbench-header"><strong>redwhisk</strong><span class="sep">/</span><span>acme/redwhisk</span><span class="sep">·</span><span>main</span></header>';
}

function appShell(active, surface) {
  return '<div class="app">' + activityBar(active) + '<div class="workbench">' + workbenchHeader() + surface + '</div></div>';
}

function button(label, variant, action, disabled, extra) {
  return '<button class="btn ' + variant + '" type="button" data-action="' + action + '"' + (disabled ? " disabled" : "") + (extra || "") + '>' + label + '</button>';
}

function iconButton(name, label, action) {
  return '<button class="icon-btn" type="button" aria-label="' + esc(label) + '" title="' + esc(label) + '" data-action="' + action + '">' + icon(name, 16) + '</button>';
}

function sourceBadge(source) {
  if (source === "github") return '<span class="source-badge">' + icon("github", 12) + 'GitHub</span>';
  if (source === "gitlab") return '<span class="source-badge">' + icon("gitlab", 12) + 'GitLab</span>';
  return '<span class="source-badge">' + icon("issues", 12) + '本地</span>';
}

function sourceNumber(source, number) {
  if (source === "github") return 'GH #' + number;
  if (source === "gitlab") return 'GL #' + number;
  return '#' + number;
}

function syncBanner() {
  if (model.sync === "ok") {
    return '<div class="sync-banner"><span class="dot ok"></span><span>' + esc(model.syncText) + '</span><span class="spacer"></span><span class="subtle">下次自动同步约 90 秒后</span><button class="btn btn-ghost btn-sm" type="button" data-action="sync">' + icon("refresh", 13) + '立即同步</button></div>';
  }
  if (model.sync === "auth") {
    return '<div class="sync-banner is-danger">' + icon("alert", 14) + '<span><strong>GitHub 凭据已过期。</strong> 当前显示 12 分钟前的缓存；写入与新建已暂停。</span><span class="spacer"></span><button class="btn btn-sm" type="button" data-action="relogin">重新登录</button><button class="btn btn-ghost btn-sm" type="button" data-action="sync">重试</button></div>';
  }
  if (model.sync === "off") {
    return '<div class="sync-banner"><span class="dot"></span><span>仅本地模式：不访问 GitHub / GitLab。已同步的远程 Issue 被隐藏但保留。</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" type="button" data-go="s5">去设置切换</button></div>';
  }
  if (model.sync === "deleted") {
    return '<div class="sync-banner is-danger">' + icon("alert", 14) + '<span><strong>远端 Issue 已删除或当前账号无权访问。</strong> 本地副本与历史仍保留，同步已停止。</span><span class="spacer"></span><button class="btn btn-sm" type="button" data-action="keep-local">保留为本地</button><button class="btn btn-ghost btn-sm" type="button" data-action="unlink">移除关联</button></div>';
  }
  return "";
}

function surfaceTabs() {
  const issuesActive = model.tab !== "prs";
  const issueTarget = model.mode === "local" ? "s13" : "s1";
  const prTarget = model.mode === "local" ? "s15" : "s7";
  return '<div class="surface-tabs" role="tablist">'
    + '<button class="surface-tab" type="button" role="tab" aria-selected="' + issuesActive + '" data-go="' + issueTarget + '">Issues <span class="count">' + (model.issueCounts ? totalIssues() : 24) + '</span></button>'
    + '<button class="surface-tab" type="button" role="tab" aria-selected="' + (!issuesActive) + '" data-go="' + prTarget + '">Pull requests <span class="count">' + (model.prCount != null ? model.prCount : 8) + '</span></button>'
    + '</div>';
}

function totalIssues() {
  if (!model.issueCounts) return 24;
  return Object.values(model.issueCounts).reduce((sum, value) => sum + value, 0);
}

function sourceFilter() {
  const options = [
    ["all", "全部来源"],
    ["local", "仅本地"],
    ["github", "GitHub"],
    ["gitlab", "GitLab"],
  ];
  return '<select class="select select-inline" data-field="sourceFilter" aria-label="来源筛选">'
    + options.map(([value, label]) => '<option value="' + value + '"' + (model.sourceFilter === value ? " selected" : "") + '>' + label + '</option>').join("")
    + '</select>';
}

function issuesSurface() {
  const canCreate = model.mode !== "remote" || model.sync === "ok";
  const createLabel = model.mode === "local" ? "新建本地 Issue" : model.mode === "remote" ? "新建远程 Issue" : "新建 Issue";
  const header = '<header class="surface-header">' + surfaceTabs()
    + '<div class="surface-actions">' + sourceFilter()
    + '<span class="inline-status"><span class="dot ' + (model.sync === "ok" ? "ok" : model.sync === "auth" ? "bad" : "") + '"></span>' + esc(model.syncText) + '</span>'
    + iconButton("refresh", "立即同步", "sync")
    + button(icon("plus", 14) + ' ' + createLabel, "btn-primary", "create-issue", !canCreate)
    + '</div></header>';
  return '<section class="surface" aria-label="Issues 工作台">' + header + syncBanner() + board() + '</section>';
}

const LANES = [
  { key: "backlog", label: "待办" },
  { key: "running", label: "进行中" },
  { key: "review", label: "待审核" },
  { key: "completed", label: "已完成" },
];

const CARDS = {
  backlog: [
    { id: "a", source: "github", number: 128, title: "支持从 GitHub / GitLab 同步 Issue", desc: "项目设置选择来源模式；远程 Issue 进入看板，保留本地工作流状态。", labels: ["enhancement", "sync"], pr: { number: 132, state: "blocked", text: "PR #132 · 1 个检查失败" } },
    { id: "b", source: "local", number: 12, title: "完成流程支持关联已有 PR", desc: "已有打开的 PR 时不再创建，改为关联并完成。", labels: ["local"], pr: null },
    { id: "c", source: "gitlab", number: 7, title: "MR 检查失败时阻止合并", desc: "合并弹窗展示失败检查，主按钮禁用。", labels: ["bug", "gitlab"], pr: { number: 41, state: "ok", text: "MR !41 · 4/4 通过" } },
    { id: "d", source: "github", number: 131, title: "PR 详情展示 review 状态", desc: "Approve / Request changes / Review required 三态。", labels: ["enhancement"], pr: null },
  ],
  running: [
    { id: "e", source: "github", number: 130, title: "同步游标与 ETag 缓存", desc: "减少重复请求，限流时退避并保留缓存。", labels: ["performance"], pr: null },
    { id: "f", source: "local", number: 14, title: "Issue 来源筛选与计数", desc: "看板顶部按本地 / GitHub / GitLab 过滤。", labels: ["local", "ui"], pr: null },
  ],
  review: [
    { id: "g", source: "github", number: 126, title: "远程评论合并进时间轴", desc: "GitHub 评论、系统事件与本地 Agent 交付按时间交错。", labels: ["sync"], pr: { number: 129, state: "ok", text: "PR #129 · 已批准" } },
  ],
  completed: [
    { id: "h", source: "github", number: 121, title: "Issue 来源模式设置", desc: "仅本地 / 仅远程 / 混合三种模式。", labels: ["settings"], pr: { number: 124, state: "merged", text: "PR #124 · 已合并" } },
    { id: "i", source: "local", number: 9, title: "设置页拆分 Issues 模块", desc: "把来源、同步与完成动作集中到一个页面。", labels: ["local"], pr: null },
    { id: "j", source: "gitlab", number: 3, title: "GitLab 自建实例 host 识别", desc: "从 git remote 解析 host，不要求 gitlab.com。", labels: ["gitlab"], pr: null },
  ],
};

function visibleCards(lane) {
  let cards = CARDS[lane] || [];
  if (model.mode === "local") cards = cards.filter((card) => card.source === "local");
  if (model.mode === "remote") cards = cards.filter((card) => card.source !== "local");
  if (model.sourceFilter === "local") cards = cards.filter((card) => card.source === "local");
  if (model.sourceFilter === "github" || model.sourceFilter === "gitlab") cards = cards.filter((card) => card.source === model.sourceFilter);
  return cards;
}

function board() {
  return '<div class="board">' + LANES.map((lane) => {
    const cards = visibleCards(lane.key);
    const total = model.issueCounts ? model.issueCounts[lane.key] : cards.length;
    return '<section class="lane lane--' + lane.key + '" aria-label="' + lane.label + '">'
      + '<div class="lane-header"><span class="lane-dot"></span><h3>' + lane.label + '</h3><span class="lane-count">' + total + '</span><span class="spacer"></span>'
      + (lane.key === "backlog" ? '<button class="icon-btn" type="button" aria-label="新建 Issue" data-action="create-issue">' + icon("plus", 14) + '</button>' : "")
      + '</div><div class="lane-cards">'
      + cards.map(issueCard).join("")
      + (cards.length === 0 ? '<div class="empty-state" style="padding:24px 8px"><span class="subtle">这个来源下暂无 Issue</span></div>' : "")
      + '</div></section>';
  }).join("") + '</div>';
}

function issueCard(card) {
  const selected = sceneById(sceneId).kind === "issue-detail" && model.number === card.number ? " is-selected" : "";
  const prClass = card.pr ? (card.pr.state === "blocked" ? " is-blocked" : card.pr.state === "ok" ? " is-ok" : "") : "";
  return '<button class="card' + selected + '" type="button" data-action="open-issue" data-issue="' + card.number + '">'
    + '<span class="card-meta"><span class="card-id">' + sourceNumber(card.source, card.number) + '</span><span>·</span><span class="card-time">2 小时前</span><span class="spacer"></span>' + sourceBadge(card.source) + '</span>'
    + '<span class="card-title">' + esc(card.title) + '</span>'
    + '<span class="card-desc">' + esc(card.desc) + '</span>'
    + (card.labels.length ? '<span class="card-labels">' + card.labels.map((label) => '<span class="label-chip">' + esc(label) + '</span>').join("") + '</span>' : "")
    + (card.pr ? '<span class="card-pr' + prClass + '">' + icon("pr", 12) + esc(card.pr.text) + '</span>' : "")
    + '</button>';
}

function issueDetailSurface() {
  const source = model.source;
  const sourceName = source === "github" ? "GitHub" : source === "gitlab" ? "GitLab" : "本地";
  const numberText = sourceNumber(source, model.number);
  const stateChip = model.state === "open" ? '<span class="chip chip-success">open</span>'
    : model.state === "closed" ? '<span class="chip">closed</span>'
    : '<span class="chip chip-danger">不可用</span>';
  const header = '<header class="surface-header">' + surfaceTabs()
    + '<div class="surface-actions">' + iconButton("back", "返回看板", "back")
    + button(icon("external", 13) + ' 打开 ' + sourceName, "btn-secondary", "open-external")
    + button(icon("play", 13) + ' 运行', "btn-primary", "run")
    + iconButton("settings", "更多", "more")
    + '</div></header>';
  const banner = model.deletedRemote
    ? syncBanner()
    : '<div class="source-banner">' + sourceBadge(source) + '<span class="mono">' + esc(source === "github" ? "acme/redwhisk" : source === "gitlab" ? "acme/redwhisk" : "本地") + ' #' + model.number + '</span>' + stateChip
      + '<span>作者 <strong>lin</strong></span><span>指派给 <strong>yujianjia</strong></span>'
      + '<span class="chip">enhancement</span><span class="chip">sync</span><span class="chip">v0.9</span>'
      + '<span class="spacer"></span><span class="inline-status"><span class="dot ok"></span>' + esc(model.syncText) + '</span>'
      + '<span class="subtle">' + icon("lock", 11) + ' 远程正文只读</span></div>';
  const body = '<div class="page">'
    + '<div class="page-header"><div><h2>' + numberText + ' · ' + esc(model.title) + '</h2>'
    + '<div class="sub"><span class="chip">' + (model.state === "open" ? "待办" : model.state === "closed" ? "已完成" : "不可用") + '</span><span>本地工作流状态与远端 open/closed 分开</span></div></div>'
    + '<div class="page-actions">' + button("状态", "btn-secondary", "status") + button("编辑远程", "btn-secondary", "edit-remote", model.deletedRemote) + button("删除本地副本", "btn-danger", "delete") + '</div></div>'
    + '<div class="detail-grid"><div class="detail-main">'
    + (model.deletedRemote ? '<div class="note is-danger" style="margin-top:12px">远端对象已不存在。保留本地副本后，它会变成普通本地 Issue；移除关联则只删除同步关系。</div>' : '')
    + issueBody()
    + timeline()
    + '</div><aside class="detail-side">'
    + linkedPrPanel()
    + sessionPanel()
    + localPanel()
    + '</aside></div></div>';
  return '<section class="surface" aria-label="Issue 详情">' + header + banner + body + '</section>';
}

function timeline() {
  if (model.deletedRemote) {
    return '<ol class="timeline">'
      + '<li class="timeline-item"><span class="avatar is-agent">A</span><div class="timeline-body"><div class="timeline-meta"><strong>系统</strong><span>远端对象已不可用，同步已停止</span><span>·</span><span>刚刚</span><span class="chip">本地</span></div><div class="comment"><div class="markdown"><p>本地副本、评论与会话历史仍保留。选择「保留为本地」后，这条 Issue 会变成普通本地 Issue。</p></div></div></div></li>'
      + '</ol>';
  }
  return '<ol class="timeline">'
    + '<li class="timeline-item"><span class="avatar is-remote">L</span><div class="timeline-body"><div class="timeline-meta"><strong>lin</strong><span>在 GitHub 创建了 Issue</span><span>·</span><span>3 天前</span><span class="chip">GitHub</span></div></div></li>'
    + '<li class="timeline-item"><span class="avatar is-remote">M</span><div class="timeline-body"><div class="timeline-meta"><strong>maya</strong><span>评论</span><span>·</span><span>2 天前</span><span class="chip">GitHub</span></div><div class="comment"><div class="markdown"><p>混合模式下，本地 Issue 的编号会不会和远程 <code>#128</code> 冲突？</p></div></div></div></li>'
    + '<li class="timeline-item"><span class="avatar is-remote">L</span><div class="timeline-body"><div class="timeline-meta"><strong>lin</strong><span>评论</span><span>·</span><span>2 天前</span><span class="chip">GitHub</span></div><div class="comment"><div class="markdown"><p>不会。项目内 <code>number</code> 继续作为本地主键用于 worktree 命名；界面显示远程编号，并在详情里标明仓库。</p></div></div></div></li>'
    + '<li class="timeline-item"><span class="avatar is-agent">A</span><div class="timeline-body"><div class="timeline-meta"><strong>Codex</strong><span>启动了 Agent 会话</span><span>·</span><span>2 小时前</span><span class="chip">本地</span></div></div></li>'
    + '<li class="timeline-item"><span class="avatar is-agent">A</span><div class="timeline-body"><div class="timeline-meta"><strong>Codex</strong><span>交付摘要</span><span>·</span><span>1 小时前</span><span class="chip">本地</span></div><div class="comment"><div class="markdown"><p>已补上来源徽标与同步状态条；下一步接 <code>gh issue list</code> 的 JSON 适配层。</p></div></div></div></li>'
    + '</ol>';
}

function issueBody() {
  if (model.deletedRemote) {
    return '<div class="markdown" style="margin-top:14px">'
      + '<p>这个 Issue 的远端对象已被删除，或当前账号已无权访问。RedWhisk 保留了本地副本、评论与会话历史；同步已停止。</p>'
      + '<h3>你可以做什么</h3><ul><li>保留为本地 Issue，继续在 RedWhisk 里推进。</li><li>移除远程关联，只留下本地副本。</li><li>重试一次；如果只是权限问题，恢复后可以继续同步。</li></ul>'
      + '<blockquote>应用不会因为一次 404 就自动删除本地数据。</blockquote>'
      + '</div>';
  }
  return '<div class="markdown" style="margin-top:14px">'
    + '<p>当前 Issue 只能手动录入，团队已经在 GitHub 里维护同一批任务。希望 RedWhisk 能直接拉取远程 Issue，同时不破坏现有的本地工作流。</p>'
    + '<h3>目标</h3><ul><li>项目级选择「仅本地 / 仅远程 / 混合」。</li><li>远程 Issue 进入看板后仍可用 Agent 执行与完成流程。</li><li>PR/MR 不再只支持创建，还能查看检查、评审与合并状态。</li></ul>'
    + '<h3>边界</h3><blockquote>远程正文 v1 只读；状态写回是显式动作，不做双向字段同步。</blockquote>'
    + '<pre><code>issue_source_mode = local | remote | mixed</code></pre>'
    + '</div>';
}

function linkedPrPanel() {
  if (!model.hasPr) {
    return '<section class="panel"><div class="panel-header"><h3>关联 PR/MR</h3></div><div class="panel-body"><div class="subtle" style="font-size:12px">还没有关联的 PR/MR。完成时可以创建，或手动关联已有请求。</div><div style="margin-top:8px">' + button("关联已有 PR", "btn-secondary", "link-pr") + '</div></div></section>';
  }
  const state = model.prState === "open" ? "open" : model.prState === "merged" ? "merged" : "closed";

    + '<div class="linked-card"><span class="pr-state ' + state + '">' + icon("pr", 12) + '</span><div class="grow"><div class="title">PR #' + model.prNumber + ' · 支持远程 Issue 同步</div><div class="meta">feat/remote-issue → main · 检查 ' + esc(model.prChecks) + '</div></div></div>'
    + '<div style="display:flex;gap:6px;margin-top:9px">' + button("查看 PR", "btn-secondary", "open-pr") + button("在 GitHub 打开", "btn-ghost", "open-external") + '</div>'
    + '</div></section>';
}

function sessionPanel() {
  const worktree = 'issue-' + model.number + '-redwhisk';
  return '<section class="panel"><div class="panel-header"><h3>本地 Agent 会话</h3><span class="chip chip-success">running</span></div><div class="panel-body"><dl class="facts">'
    + '<dt>Agent</dt><dd>Codex · gpt-5</dd><dt>工作树</dt><dd class="mono">' + esc(worktree) + '</dd><dt>分支</dt><dd class="mono">feat/remote-issue</dd><dt>Token</dt><dd>128k / 32k</dd>'
    + '</dl><div style="margin-top:9px">' + button("打开会话", "btn-secondary", "open-session") + '</div></div></section>';

function localPanel() {
  return '<section class="panel"><div class="panel-header"><h3>本地字段</h3></div><div class="panel-body"><dl class="facts">'
    + '<dt>本地编号</dt><dd class="mono">#42</dd><dt>本地标签</dt><dd><span class="chip">本地</span></dd><dt>附件</dt><dd class="subtle">远程 Issue 不接收本地附件</dd>'
    + '</dl></div></section>';

function settingsSurface() {
  const mode = model.mode;
  const isRemote = mode !== "local";
  const isGitLab = model.host === "gitlab";
  const requestNoun = isGitLab ? "Merge Request" : "Pull Request";
  const requestShort = isGitLab ? "MR" : "PR";
  const cli = isGitLab ? "glab" : "gh";
  const sourceCards = [
    ["local", "仅本地", "完全不访问远程。适合纯本地项目。"],
    ["remote", "仅远程", "看板只显示远程 Issue；本地 Issue 隐藏但保留。"],
    ["mixed", "混合", "本地与远程 Issue 同时出现，新建时再选来源。"],

function prMetaPanel() {
  return '<section class="panel"><div class="panel-header"><h3>信息</h3></div><div class="panel-body"><dl class="facts">'
    + '<dt>作者</dt><dd>yujianjia</dd><dt>源分支</dt><dd class="mono">feat/remote-issue</dd><dt>目标分支</dt><dd class="mono">main</dd><dt>提交</dt><dd>2</dd><dt>变更</dt><dd>+412 −87</dd><dt>最后同步</dt><dd>1 分钟前</dd>'
    + '</dl></div></section>';
}

function prMergeDialog() {
  const blocked = model.mergeable !== "clean";
  return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="merge-title">'
    + '<h3 id="merge-title">合并 PR #' + model.prNumber + '</h3>'
    + '<p class="dialog-sub">' + esc(model.prTitle) + '</p>'
    + '<div class="merge-status ' + (blocked ? "is-blocked" : "is-ready") + '">' + icon(blocked ? "alert" : "check", 14) + '<div>' + (blocked ? '<strong>宿主当前不允许合并</strong><ul><li>test (ubuntu-latest) 失败</li><li>需要 1 个批准</li></ul>' : '<strong>可以合并</strong>') + '</div></div>'
    + '<div class="field" style="margin-top:12px"><label>合并方式</label>'
    + '<label class="radio-line"><input type="radio" name="merge-method" data-field="mergeMethod" value="squash"' + (model.mergeMethod === "squash" ? " checked" : "") + ' /><span><strong>Squash and merge</strong><div class="desc">把 2 个提交压成 1 个，历史更干净。</div></span></label>'
    + '<label class="radio-line"><input type="radio" name="merge-method" data-field="mergeMethod" value="merge"' + (model.mergeMethod === "merge" ? " checked" : "") + ' /><span><strong>Create a merge commit</strong><div class="desc">保留分支拓扑。</div></span></label>'
    + '<label class="radio-line"><input type="radio" name="merge-method" data-field="mergeMethod" value="rebase"' + (model.mergeMethod === "rebase" ? " checked" : "") + ' /><span><strong>Rebase and merge</strong><div class="desc">线性历史，不产生 merge commit。</div></span></label>'
    + '</div>'
    + '<div class="checkline" style="margin-top:10px"><input type="checkbox" data-field="deleteBranch"' + (model.deleteBranch ? " checked" : "") + ' />合并后删除源分支</div>'
    + '<div class="actions">' + button("取消", "btn-secondary", "cancel") + button("在 GitHub 中处理", "btn-secondary", "open-external") + button("合并", "btn-primary", "confirm-merge", blocked) + '</div>'
    + '</div></div>';
}

function prCreateSurface() {
  return '<section class="surface" aria-label="创建 Pull Request"><header class="surface-header"><div class="surface-tabs"><span class="surface-tab" aria-selected="true">变更</span></div><div class="surface-actions"><span class="subtle">feat/remote-issue</span></div></header>'
    + '<div class="page"><div class="page-header"><div><h2>创建 Pull Request</h2><div class="sub"><span class="mono">feat/remote-issue</span><span>→</span><span class="mono">main</span><span>·</span><span>2 个提交</span></div></div><div class="page-actions">' + button("取消", "btn-secondary", "cancel") + button("创建 Pull Request", "btn-primary", "confirm-create-pr") + '</div></div>'
    + '<div class="detail-grid"><div class="detail-main"><section class="panel"><div class="panel-body">'
    + '<div class="field"><label>标题</label><input class="input" data-field="title" value="' + esc(model.title) + '" /></div>'
    + '<div class="field"><label>正文</label><textarea class="textarea" rows="5" data-field="body">' + esc(model.body) + '</textarea><div class="hint">远程 Issue 会在正文自动追加 <code>Closes #128</code>；本地 Issue 只建立应用内关联。</div></div>'
    + '<div class="field"><label>关联 Issue</label><select class="select" data-field="linkedIssue"><option value="">不关联</option><option value="github:128"' + (model.linkedIssue === "github:128" ? " selected" : "") + '>GH #128 · 支持从 GitHub / GitLab 同步 Issue</option><option value="local:12"' + (model.linkedIssue === "local:12" ? " selected" : "") + '>本地 #12 · 完成流程支持关联已有 PR</option></select></div>'
    + '<div class="checkline" style="margin-top:10px"><input type="checkbox" data-field="draft"' + (model.draft ? " checked" : "") + ' />创建为草稿</div>'
    + '</div></section></div><aside class="detail-side"><section class="panel"><div class="panel-header"><h3>将发生什么</h3></div><div class="panel-body"><div class="markdown" style="font-size:12px"><ul><li>推送 <code>feat/remote-issue</code> 到 origin。</li><li>在 GitHub 创建草稿 PR。</li><li>写入关联；不改变 Issue 的本地状态。</li><li>PR 合并后，按设置关闭 GH #128。</li></ul></div></div></section></aside></div></div></section>';
}

function renderStage() {
  const scene = sceneById(sceneId);
  let html = "";
  if (scene.kind === "board") html = appShell("issues", issuesSurface());
  else if (scene.kind === "issue-detail") html = appShell("issues", issueDetailSurface());
  else if (scene.kind === "issue-create") html = appShell("issues", issueCreateSurface());
  else if (scene.kind === "settings") html = appShell("settings", settingsSurface());
  else if (scene.kind === "mode-switch") html = appShell("settings", settingsSurface()) + modeSwitchDialog();
  else if (scene.kind === "pr-list") html = appShell("issues", prListSurface());
  else if (scene.kind === "pr-empty") html = appShell("issues", prEmptySurface());
  else if (scene.kind === "pr-detail") html = appShell("issues", prDetailSurface());
  else if (scene.kind === "pr-merge") html = appShell("issues", prDetailSurface()) + prMergeDialog();
  else if (scene.kind === "pr-create") html = appShell("changes", prCreateSurface());
  document.getElementById("stage").innerHTML = html;
  document.getElementById("caption").textContent = scene.caption;
}

function issueCreateSurface() {
  const sourceCards = [
    ["local", "本地", "只存在本机，不访问远程。"],
    ["github", "GitHub", "创建到 acme/redwhisk，再回填本地。"],
    ["gitlab", "GitLab", "创建到 acme/redwhisk，再回填本地。"],
  ];
  return '<section class="surface" aria-label="新建 Issue"><header class="surface-header"><div class="surface-tabs"><span class="surface-tab" aria-selected="true">新建 Issue</span></div><div class="surface-actions">' + button("取消", "btn-secondary", "cancel") + button("创建", "btn-primary", "confirm-create-issue") + '</div></header>'
    + '<div class="page"><div class="page-header"><div><h2>新建 Issue</h2><div class="sub"><span>项目 acme/redwhisk</span><span>·</span><span>混合模式</span></div></div></div>'
    + '<div class="detail-grid"><div class="detail-main"><section class="panel"><div class="panel-body">'
    + '<div class="field"><label>来源</label><div class="radio-cards">' + sourceCards.map(([value, name, desc]) => '<label class="radio-card' + (model.source === value ? " is-selected" : "") + '"><div class="name"><input type="radio" name="create-source" value="' + value + '" data-field="source"' + (model.source === value ? " checked" : "") + ' />' + name + '</div><div class="desc">' + desc + '</div></label>').join("") + '</div></div>'
    + '<div class="field"><label>标题</label><input class="input" data-field="title" value="' + esc(model.title) + '" /></div>'
    + '<div class="field"><label>正文</label><textarea class="textarea" rows="7" data-field="body">' + esc(model.body) + '</textarea></div>'
    + '<div class="field"><label>标签</label><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">enhancement</span><span class="chip">sync</span><button class="btn btn-ghost btn-sm" type="button">+ 选择标签</button></div></div>'
    + '</div></section></div><aside class="detail-side"><section class="panel"><div class="panel-header"><h3>创建位置</h3></div><div class="panel-body"><dl class="facts">'
    + '<dt>来源</dt><dd>' + (model.source === "github" ? "GitHub · acme/redwhisk" : model.source === "gitlab" ? "GitLab · acme/redwhisk" : "仅本地") + '</dd>'
    + '<dt>账号</dt><dd>' + (model.source === "local" ? "—" : "yujianjia（已登录）") + '</dd>'
    + '<dt>完成后</dt><dd>' + (model.source === "local" ? "进入本地待办" : "远程创建成功后回填为待办") + '</dd>'
    + '</dl>' + (model.source === "local" ? '<div class="note" style="margin-top:10px">本地 Issue 不参与远程同步，也不会被远端关闭。</div>' : '<div class="note" style="margin-top:10px">远程创建需要 Issues 写权限；失败时不会留下本地半成品。</div>') + '</div></section></aside></div></div></section>';
}

function renderState() {
  const scene = sceneById(sceneId);
  const index = SCENES.indexOf(scene) + 1;
  const lines = [
    "场景: " + index + " " + scene.title,
    "来源模式: " + (model.mode || "—"),
    "当前 Tab: " + (model.tab || "—"),
    "来源筛选: " + (model.sourceFilter || "—"),
    "同步: " + (model.sync || "—") + (model.syncText ? " · " + model.syncText : ""),
    "操作: " + (actionNote || "—"),
  ];
  if (model.prFilter) lines.push("PR 筛选: " + model.prFilter);
  if (model.prTab) lines.push("PR 详情 Tab: " + model.prTab);
  if (model.mergeMethod) lines.push("合并方式: " + model.mergeMethod);
  if (model.linkedIssue) lines.push("关联 Issue: " + model.linkedIssue);
  document.getElementById("state").textContent = lines.join("\n");
}

function render() {
  renderNav();
  renderStage();
  renderState();
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-scene],[data-go],[data-action]");
  const fieldButton = event.target.closest("button[data-field]");
  if (!target && !fieldButton) return;
  if (fieldButton) {
    const field = fieldButton.dataset.field;
    const value = fieldButton.dataset.value || fieldButton.value;
    if (field === "prFilter") model.prFilter = value;
    else if (field === "prTab") model.prTab = value;
    render();
    return;
  }
  if (target.dataset.scene) {
    applyScene(target.dataset.scene);
    return;
  }
  if (target.dataset.go) {
    applyScene(target.dataset.go);
    return;
  }
  const action = target.dataset.action;
  if (action === "go-settings") {
    applyScene("s5");
    return;
  }
  if (action === "noop") {
    actionNote = "该操作在当前状态不可用";
  } else if (action === "open-issue") {
    const number = Number(target.dataset.issue || 128);
    const card = Object.values(CARDS).flat().find((item) => item.number === number);
    applyScene("s3");
    if (card) {
      model.source = card.source;
      model.number = card.number;
      model.title = card.title;
      model.hasPr = Boolean(card.pr);
      model.prNumber = card.pr ? card.pr.number : 0;
      model.prState = card.pr ? (card.pr.state === "blocked" ? "open" : card.pr.state === "merged" ? "merged" : "open") : "none";
      model.prChecks = card.pr ? card.pr.text.replace(/^[^·]+·\s*/, "") : "";
    }
    render();
    return;
  }
  if (action === "open-pr") {
    applyScene("s8");
    return;
  }
  if (action === "back") {
    applyScene("s1");
    return;
  }
  if (action === "back-pr") {
    applyScene("s7");
    return;
  }
  if (action === "sync") {
    actionNote = "触发一次同步；场景是静态稿，不真正访问远程";
  } else if (action === "relogin") {
    actionNote = "打开 gh auth login / glab auth login 引导";
  } else if (action === "confirm-mode") {
    const next = model.nextMode || "mixed";
    applyScene("s5");
    model.mode = next;
    actionNote = "已切换到 " + next;
    render();
    return;
  } else if (action === "merge" || action === "confirm-merge") {
    if (action === "merge") {
      applyScene("s10");
      return;
    }
    actionNote = "合并按钮当前" + (model.mergeable === "clean" ? "可用" : "禁用：检查或评审未满足");
  } else if (action === "save") {
    actionNote = "保存设置；模式切换会先弹出影响确认";
  } else if (action === "create-issue") {
    applyScene("s4");
    return;
  } else if (action === "open-external") {
    actionNote = "打开宿主页面";
  } else if (action === "run") {
    actionNote = "打开 Run Dialog；远程来源不影响 Agent 启动";
  } else if (action === "open-pr") {
    applyScene("s8");
    return;
  } else if (action === "keep-local") {
    actionNote = "保留为本地 Issue，并停止远程同步";
  } else if (action === "unlink") {
    actionNote = "移除远程关联，本地副本仍保留";
  } else {
    actionNote = "静态稿：" + (target.textContent || "").trim().slice(0, 24);
  }
  renderState();
});

document.addEventListener("change", (event) => {
  const field = event.target.dataset.field;
  if (!field) return;
  if (field === "mode") {
    const next = event.target.value;
    if (model.mode === "mixed" && next !== "mixed") {
      model.nextMode = next;
      sceneId = "s6";
      model.localCount = 6;
      model.remoteCount = 18;
      render();
      return;
    }
    model.mode = next;
  } else if (field === "sourceFilter") {
    model.sourceFilter = event.target.value;
  } else if (field === "prFilter") {
    model.prFilter = event.target.dataset.value || event.target.value;
  } else if (field === "prTab") {
    model.prTab = event.target.dataset.value || event.target.value;
  } else if (field === "mergeMethod") {
    model.mergeMethod = event.target.value;
  } else if (field === "source") {
    model.source = event.target.value;
  } else if (field === "linkedIssue") {
    model.linkedIssue = event.target.value;
  } else if (field === "autoSync" || field === "closeOnComplete" || field === "commentOnComplete" || field === "closeOnPrMerge" || field === "confirmCompletionAction" || field === "draft" || field === "deleteBranch") {
    model[field] = event.target.checked;
  } else if (field === "title" || field === "body" || field === "scope" || field === "interval" || field === "completionAction" || field === "host") {
    model[field] = event.target.value;
  }
  render();
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  const index = SCENES.findIndex((scene) => scene.id === sceneId);
  const nextIndex = event.key === "ArrowLeft" ? Math.max(0, index - 1) : Math.min(SCENES.length - 1, index + 1);
  if (nextIndex !== index) applyScene(SCENES[nextIndex].id);
});

applyScene(SCENES.some((scene) => scene.id === location.hash.replace("#", "")) ? location.hash.replace("#", "") : "s1");
</script>
</body>
</html>
