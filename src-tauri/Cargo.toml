[package]
name = "redwhisk"
version = "0.0.8"
description = "RedWhisk desktop workbench"
authors = ["RedWhisk contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "redwhisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
warnings = "deny"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.0"
thiserror = "2.0.18"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
tauri-plugin-notification = "2"
# 后端关键操作日志：本地时间戳格式化与按月分桶；关闭默认特性以避免引入 vulnerable time 0.1。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# 同步阻塞 HTTP：版本检测查询 GitHub Releases latest（命令路径为同步）。
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# 工作区内容搜索：行级正则 / 全词匹配。
regex = "1"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

# Release 体积优化：lto 全量链接、strip 去符号、单 codegen-unit 配合 opt-level="s"
# 不引入 panic="abort"，避免破坏 Tauri 在 unwind 路径上的错误处理
[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"

[dev-dependencies]
tempfile = "3.23.0"
# DTO parity 签名导出器（src/types/*.rs 静态分析），仅 dev-dep，零生产依赖。
syn = { version = "2", features = ["full", "extra-traits"] }
